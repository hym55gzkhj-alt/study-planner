<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03060d">
  <title>JARVIS · Klausurassistent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/jarvis.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2300e5ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2300e5ff'/%3E%3C/svg%3E">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-scan" aria-hidden="true"></div>

  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard" aria-label="JARVIS Dashboard">
        <span class="reactor" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-text"><b>J.A.R.V.I.S</b><small>Klausurassistent</small></span>
      </a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="#/dashboard" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/></svg><span>Dashboard</span></a>
        <a href="#/exams" data-view="exams"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14zM7 11h5v5H7z"/></svg><span>Klausuren</span></a>
        <a class="soon" aria-disabled="true" title="Kommt in Schritt 4"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zm7-18-5.5 5.5 1.4 1.4L11 5.8V16h2V5.8l3.1 3.1 1.4-1.4z"/></svg><span>Import</span><em>bald</em></a>
        <a href="#/chat" data-view="chat"><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 9h12v2H6zm8 5H6v-2h8zm4-6H6V6h12z"/></svg><span>KI-Lernen</span></a>
        <a href="#/settings" data-view="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1L11 21h4l.4-2.7a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg><span>Einstellungen</span></a>
      </nav>
      <div class="sys-status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Verbinde …</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow" id="view-eyebrow">Systemübersicht</span>
          <h1 id="view-title">Dashboard</h1>
        </div>
        <div class="clock" aria-live="off">
          <span id="clock-time">--:--</span>
          <small id="clock-date"></small>
        </div>
      </header>

      <section id="view-dashboard" class="view" hidden></section>
      <section id="view-exams" class="view" hidden></section>
      <section id="view-chat" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
